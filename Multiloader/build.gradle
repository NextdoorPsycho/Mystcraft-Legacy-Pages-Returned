plugins {
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.8'
}

idea {
    project {
        settings {
            runConfigurations {
                "Fabric Client"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':fabric:runClient']
                }
                "Fabric Server"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':fabric:runServer']
                }
                "Forge Client"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':forge:Client']
                }
                "Forge Server"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':forge:Server']
                }
                "NeoForge Client"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':neoforge:runClient']
                }
                "NeoForge Server"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':neoforge:runServer']
                }
                "All Clients"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':runAllClients']
                }
                "All Servers"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':runAllServers']
                }
                "All GameTests"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':runAllGameTests']
                }
            }
        }
    }
}

tasks.register('runAllClients', Exec) {
    commandLine 'bash', 'scripts/run-all-clients.sh'
}

tasks.register('runAllServers', Exec) {
    commandLine 'bash', 'scripts/run-all-servers.sh'
}

tasks.register('runAllGameTests', Exec) {
    commandLine 'bash', 'scripts/run-all-gametests.sh'
}

subprojects {
    apply plugin: 'java'

    java {
        def perProjectJava = project.findProperty("java_version_${project.name}") ?: java_version
        toolchain.languageVersion = JavaLanguageVersion.of(perProjectJava.toString())
        withSourcesJar()
    }

    jar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${mod_name}" }
        }
        manifest {
            attributes([
                    'Specification-Title'   : mod_name,
                    'Specification-Vendor'  : mod_author,
                    'Specification-Version' : project.jar.archiveVersion,
                    'Implementation-Title'  : project.name,
                    'Implementation-Version': project.jar.archiveVersion,
                    'Implementation-Vendor' : mod_author,
                    'Built-On-Minecraft'    : minecraft_version
            ])
        }
    }

    sourcesJar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${mod_name}" }
        }
    }

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    processResources {
        def expandProps = [
                'version'                      : version,
                'group'                        : project.group,
                'minecraft_version'            : minecraft_version,
                'minecraft_version_range'      : minecraft_version_range,
                'fabric_version'               : fabric_version,
                'fabric_loader_version'        : fabric_loader_version,
                'mod_name'                     : mod_name,
                'mod_author'                   : mod_author,
                'mod_id'                       : mod_id,
                'license'                      : license,
                'description'                  : description,
                'neoforge_version'             : neoforge_version,
                'neoforge_loader_version_range': neoforge_loader_version_range,
                'forge_version'                : forge_version,
                'forge_loader_version_range'   : forge_loader_version_range,
                'credits'                      : credits,
                'java_version'                 : java_version
        ]

        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
            expand expandProps
        }

        inputs.properties(expandProps)
    }
}
