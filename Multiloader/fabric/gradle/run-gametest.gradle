loom {
    runs {
        gametest {
            server()
            setConfigName('Fabric GameTest')
            ideConfigGenerated(false)
            runDir('runs/gametest')
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
        }
    }
}

tasks.register('prepareFabricGametestFiles') {
    doLast {
        def runDir = file('runs/gametest')
        runDir.mkdirs()
        file("${runDir}/eula.txt").text = "eula=true\n"
        file("${runDir}/server.properties").text = ""
    }
}

tasks.named('runGametest') {
    dependsOn('prepareFabricGametestFiles')
}
