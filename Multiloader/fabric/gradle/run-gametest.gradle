loom {
    runs {
        gametest {
            server()
            setConfigName('Fabric GameTest')
            ideConfigGenerated(false)
            runDir('runs/gametest')
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
        }
    }
}
