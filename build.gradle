}

tasks.register('buildXCompJars') {
    group = 'build'
    description = 'Builds the supported 1.20.1 jars and copies them to build_output_dir_xcomp'
    dependsOn 'cleanLibs', 'buildAllVersions', 'copyXCompBuilds'
}

def registerTaskAlias = { String name, String taskPath, String groupName, String taskDescription ->
    tasks.register(name) {
        group = groupName
        description = taskDescription
        dependsOn taskPath
    }
}

registerTaskAlias('buildFabricJar', ':fabric:1.20.1:build', 'build', 'Builds the Fabric 1.20.1 jar')
registerTaskAlias('buildForgeJar', ':forge:1.20.1:build', 'build', 'Builds the Forge 1.20.1 jar')

registerTaskAlias('runFabricClient', ':fabric:1.20.1:runClient', 'mystcraft runners', 'Runs the Fabric 1.20.1 client')
registerTaskAlias('runFabricServer', ':fabric:1.20.1:runServer', 'mystcraft runners', 'Runs the Fabric 1.20.1 server')
registerTaskAlias('runFabricGameTest', ':fabric:1.20.1:runGametest', 'mystcraft runners', 'Runs the Fabric 1.20.1 GameTest server')
registerTaskAlias('runForgeClient', ':forge:1.20.1:runClient', 'mystcraft runners', 'Runs the Forge 1.20.1 client')
registerTaskAlias('runForgeServer', ':forge:1.20.1:runServer', 'mystcraft runners', 'Runs the Forge 1.20.1 server')
registerTaskAlias('runForgeGameTest', ':forge:1.20.1:runGameTestServer', 'mystcraft runners', 'Runs the Forge 1.20.1 GameTest server')

def port26Directory = file('ports/26.2')
def port26GradleLauncher = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('windows')
        ? 'gradlew.bat'
        : './gradlew'

def registerPort26Task = { String name, String nestedTask, String groupName, String taskDescription ->
    tasks.register(name, Exec) {
        group = groupName
        description = taskDescription
        workingDir port26Directory
        commandLine port26GradleLauncher, nestedTask, '--no-daemon'
    }
}

registerPort26Task('build26_2', 'buildPlatforms', 'build', 'Builds the Fabric and Forge Minecraft 26.2 production jars')
registerPort26Task('verify26_2', 'verifyProduction', 'verification', 'Compiles and verifies both Minecraft 26.2 production jars')
registerPort26Task('runFabric26_2Client', ':fabric:runClient', 'mystcraft runners', 'Runs the Fabric Minecraft 26.2 client')
registerPort26Task('runFabric26_2GameTest', ':fabric:runGametest', 'mystcraft runners', 'Runs the Fabric Minecraft 26.2 GameTest server')
registerPort26Task('runForge26_2Client', ':forge:runClient', 'mystcraft runners', 'Runs the Forge Minecraft 26.2 client')
registerPort26Task('runForge26_2GameTest', ':forge:runGameTestServer', 'mystcraft runners', 'Runs the Forge Minecraft 26.2 GameTest server')

tasks.register('buildAllSupported') {
    group = 'build'
    description = 'Builds every supported Minecraft 1.20.1 and 26.2 Fabric and Forge jar'
    dependsOn 'buildAllVersions', 'build26_2'
}

subprojects {
    apply plugin: 'java'

    repositories {
        maven {
            name = 'Minecraft Libraries'
            url = 'https://libraries.minecraft.net'
            content {
                includeGroup 'org.lwjgl'
            }
        }
        mavenCentral {
            content {
                excludeGroup 'org.lwjgl'
            }
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net'
        }
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net'
        }
    }

    tasks.register('cleanAllWorlds') {
        group = 'mystcraft'
        description = 'Deletes the entire saves directory to ensure a fresh start.'
        doLast {
            def paths = [
                    'runs/client/saves',
                    'runs/saves',
                    'run/saves',
                    'run/client/saves'
            ]

            paths.each { path ->
                def dir = project.file(path)
                println "Checking for worlds at: ${dir.absolutePath}"
                if (dir.exists()) {
                    println "Found worlds directory. Deleting..."
                    try {
                        if (dir.deleteDir()) {
                            println "Successfully deleted: ${path}"
                        } else {
                            println "Java delete failed. Trying shell force delete..."
                            project.exec { commandLine 'rm', '-rf', dir.absolutePath }
                            println "Shell delete command executed for: ${path}"
                        }
                    } catch (Exception e) {
                        println "Error deleting ${path}: ${e.message}"
                    }
                }
            }
        }
    }

    java {
        def perProjectJava = project.findProperty("java_version_${project.name}") ?: java_version
        toolchain.languageVersion = JavaLanguageVersion.of(perProjectJava.toString())
        withSourcesJar()
    }

    jar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${mod_name}" }
        }
        manifest {
            attributes([
                    'Specification-Title'   : mod_name,
                    'Specification-Vendor'  : mod_author,
                    'Specification-Version' : project.jar.archiveVersion,
                    'Implementation-Title'  : project.name,
                    'Implementation-Version': project.jar.archiveVersion,
                    'Implementation-Vendor' : mod_author,
                    'Built-On-Minecraft'    : minecraft_version
            ])
        }
    }

    sourcesJar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${mod_name}" }
        }
    }

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    processResources {
        def expandProps = [
                'version'                   : version,
                'group'                     : project.group,
                'minecraft_version'         : minecraft_version,
                'minecraft_version_range'   : minecraft_version_range,
                'fabric_version'            : fabric_version,
                'fabric_loader_version'     : fabric_loader_version,
                'forge_version'             : forge_version,
                'forge_loader_version_range': forge_loader_version_range,
                'mod_name'                  : mod_name,
                'mod_author'                : mod_author,
                'mod_id'                    : mod_id,
                'license'                   : license,
                'description'               : mod_description,
                'credits'                   : credits,
                'java_version'              : java_version
        ]
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml']) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }
}
