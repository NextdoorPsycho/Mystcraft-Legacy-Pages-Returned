plugins {
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.8'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

idea {
    project {
        settings {
            runConfigurations {
                "Build Psycho Jars"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':buildPsychoJars']
                }
                "Build XComp Jars"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':buildXCompJars']
                }
                "Fabric 1.20.1 Client"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':fabric:1.20.1:runClient']
                }
                "Fabric 1.20.1 Server"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':fabric:1.20.1:runServer']
                }
                "Fabric 1.20.2 Client"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':fabric:1.20.2:runClient']
                }
                "Fabric 1.20.2 Server"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':fabric:1.20.2:runServer']
                }
                "Forge 1.20.1 Client"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':forge:1.20.1:runClient']
                }
                "Forge 1.20.1 Server"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':forge:1.20.1:runServer']
                }
                "Forge 1.20.2 Client"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':forge:1.20.2:runClient']
                }
                "Forge 1.20.2 Server"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':forge:1.20.2:runServer']
                }
                "NeoForge 1.20.4 Client"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':neoforge:1.20.4:runClient']
                }
                "NeoForge 1.20.4 Server"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':neoforge:1.20.4:runServer']
                }
                "NeoForge 1.20.6 Client"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':neoforge:1.20.6:runClient']
                }
                "NeoForge 1.20.6 Server"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = [':neoforge:1.20.6:runServer']
                }
            }
        }
    }
}

tasks.register('cleanLibs') {
    group = 'build'
    description = 'Cleans libs directories and output directory'

    doLast {
        def platforms = [
            'fabric:1.20.1', 'fabric:1.20.2',
            'forge:1.20.1', 'forge:1.20.2',
            'neoforge:1.20.4', 'neoforge:1.20.6'
        ]
        platforms.each { platform ->
            try {
                def libsDir = project(":${platform}").file('build/libs')
                if (libsDir.exists()) {
                    libsDir.listFiles()?.findAll { it.name.endsWith('.jar') }?.each { it.delete() }
                    println "Cleaned ${platform}/build/libs"
                }
            } catch (Exception e) {
                // Subproject may not exist
            }
        }

        def outputDirs = [
                project.findProperty('build_output_dir')?.toString()?.trim(),
                project.findProperty('build_output_dir_psycho')?.toString()?.trim(),
                project.findProperty('build_output_dir_xcomp')?.toString()?.trim()
        ].findAll { it != null && !it.isEmpty() }.unique()
        outputDirs.each { dir ->
            def targetDir = file(dir)
            if (targetDir.exists()) {
                targetDir.listFiles()?.findAll { it.name.endsWith('.jar') }?.each { it.delete() }
                println "Cleaned output directory: ${targetDir.absolutePath}"
            }
        }
    }
}

// Build tasks
tasks.register('buildAllVersions') {
    group = 'build'
    description = 'Builds all platform/version combinations (6 JARs total)'
    dependsOn ':fabric:1.20.1:build', ':fabric:1.20.2:build',
              ':forge:1.20.1:build', ':forge:1.20.2:build',
              ':neoforge:1.20.4:build', ':neoforge:1.20.6:build'
    mustRunAfter 'cleanLibs'
}

// Copy task helper
def registerCopyTask = { String name, String outputProp ->
    tasks.register(name, Copy) {
        group = 'build'
        description = "Copies built jars to ${outputProp}"
        dependsOn 'buildAllVersions'
        mustRunAfter 'cleanLibs'

        def outputDir = project.findProperty(outputProp)?.toString()?.trim()
        if (outputDir == null || outputDir.isEmpty()) {
            enabled = false
            return
        }

        // All version-specific builds
        from(project(':fabric:1.20.1').layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources*'
            exclude '*-dev.jar'
        }
        from(project(':fabric:1.20.2').layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources*'
            exclude '*-dev.jar'
        }
        from(project(':forge:1.20.1').layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources*'
        }
        from(project(':forge:1.20.2').layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources*'
        }
        from(project(':neoforge:1.20.4').layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources*'
        }
        from(project(':neoforge:1.20.6').layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources*'
        }

        into(outputDir)

        doFirst {
            def targetDir = file(outputDir)
            if (!targetDir.exists()) {
                targetDir.mkdirs()
                println "Created output directory: ${targetDir.absolutePath}"
            }
            println "Copying jars to: ${targetDir.absolutePath}"
        }
    }
}

registerCopyTask('copyBuilds', 'build_output_dir')
registerCopyTask('copyPsychoBuilds', 'build_output_dir_psycho')
registerCopyTask('copyXCompBuilds', 'build_output_dir_xcomp')

// Comprehensive build tasks
tasks.register('buildAll') {
    group = 'build'
    description = 'Cleans, builds all versions, and copies jars to build_output_dir'
    dependsOn 'cleanLibs', 'buildAllVersions', 'copyBuilds'
}

tasks.register('buildPsychoJars') {
    group = 'build'
    description = 'Builds all versions and copies jars to build_output_dir_psycho'
    dependsOn 'cleanLibs', 'buildAllVersions', 'copyPsychoBuilds'
}

tasks.register('buildXCompJars') {
    group = 'build'
    description = 'Builds all versions and copies jars to build_output_dir_xcomp'
    dependsOn 'cleanLibs', 'buildAllVersions', 'copyXCompBuilds'
}

subprojects {
    apply plugin: 'java'

    tasks.register('cleanAllWorlds') {
        group = 'mystcraft'
        description = 'Deletes the entire saves directory to ensure a fresh start.'
        doLast {
            def paths = [
                'runs/client/saves',
                'runs/saves',
                'run/saves',
                'run/client/saves'
            ]
            
            paths.each { path ->
                def dir = project.file(path)
                println "Checking for worlds at: ${dir.absolutePath}"
                if (dir.exists()) {
                    println "Found worlds directory. Deleting..."
                    try {
                        if (dir.deleteDir()) {
                             println "Successfully deleted: ${path}"
                        } else {
                             println "Java delete failed. Trying shell force delete..."
                             project.exec { commandLine 'rm', '-rf', dir.absolutePath }
                             println "Shell delete command executed for: ${path}"
                        }
                    } catch (Exception e) {
                        println "Error deleting ${path}: ${e.message}"
                    }
                }
            }
        }
    }

    java {
        def perProjectJava = project.findProperty("java_version_${project.name}") ?: java_version
        toolchain.languageVersion = JavaLanguageVersion.of(perProjectJava.toString())
        withSourcesJar()
    }

    jar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${mod_name}" }
        }
        manifest {
            attributes([
                    'Specification-Title'   : mod_name,
                    'Specification-Vendor'  : mod_author,
                    'Specification-Version' : project.jar.archiveVersion,
                    'Implementation-Title'  : project.name,
                    'Implementation-Version': project.jar.archiveVersion,
                    'Implementation-Vendor' : mod_author,
                    'Built-On-Minecraft'    : minecraft_version
            ])
        }
    }

    sourcesJar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${mod_name}" }
        }
    }

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    processResources {
        if (project.path.startsWith(':neoforge:')) {
            return
        }
        def expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'forge_version'                : forge_version,
            'forge_loader_version_range'   : forge_loader_version_range,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : description,
            'credits'                      : credits,
            'java_version'                 : java_version
        ]
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }
}
