plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

def isMystcraftReleaseJar = { File file ->
    file.isFile()
            && file.name.endsWith('.jar')
            && (file.name.startsWith('MystcraftLegacy_') || file.name.startsWith('mystcraft_legacy'))
}

tasks.register('cleanLibs') {
    group = 'build'
    description = 'Cleans libs directories and output directory'

    doLast {
        def platforms = ['fabric:1.20.1', 'forge:1.20.1']
        platforms.each { platform ->
            try {
                def libsDir = project(":${platform}").file('build/libs')
                if (libsDir.exists()) {
                    libsDir.listFiles()?.findAll { it.name.endsWith('.jar') }?.each { it.delete() }
                    println "Cleaned ${platform}/build/libs"
                }
            } catch (Exception ignored) {
            }
        }

        def outputDirs = [
                project.findProperty('build_output_dir')?.toString()?.trim(),
                project.findProperty('build_output_dir_psycho')?.toString()?.trim(),
                project.findProperty('build_output_dir_xcomp')?.toString()?.trim()
        ].findAll { it != null && !it.isEmpty() }.unique()
        outputDirs.each { dir ->
            def targetDir = file(dir)
            if (targetDir.exists()) {
                targetDir.listFiles()?.findAll(isMystcraftReleaseJar)?.each { it.delete() }
                println "Cleaned output directory: ${targetDir.absolutePath}"
            }
        }
    }
}

tasks.register('buildAllVersions') {
    group = 'build'
    description = 'Builds the supported 1.20.1 Fabric and Forge jars'
    dependsOn ':fabric:1.20.1:build', ':forge:1.20.1:build'
    mustRunAfter 'cleanLibs'
}

def registerCopyTask = { String name, String outputProp ->
    tasks.register(name, Copy) {
        group = 'build'
        description = "Copies built jars to ${outputProp}"
        dependsOn 'buildAllVersions'
        mustRunAfter 'cleanLibs'

        def outputDir = project.findProperty(outputProp)?.toString()?.trim()
        if (outputDir == null || outputDir.isEmpty()) {
            enabled = false
            return
        }

        from(project(':fabric:1.20.1').layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources*'
            exclude '*-dev.jar'
        }
        from(project(':forge:1.20.1').layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources*'
            exclude '*-all.jar'
        }

        into(outputDir)

        doFirst {
            def targetDir = file(outputDir)
            if (!targetDir.exists()) {
                targetDir.mkdirs()
                println "Created output directory: ${targetDir.absolutePath}"
            }
            def deleted = 0
            targetDir.listFiles()?.each { File f ->
                if (isMystcraftReleaseJar(f)) {
                    if (f.delete()) {
                        deleted++
                    }
                }
            }
            if (deleted > 0) {
                println "Deleted ${deleted} old Mystcraft jars from: ${targetDir.absolutePath}"
            }
            println "Copying jars to: ${targetDir.absolutePath}"
        }
    }
}

registerCopyTask('copyBuilds', 'build_output_dir')
registerCopyTask('copyPsychoBuilds', 'build_output_dir_psycho')
registerCopyTask('copyXCompBuilds', 'build_output_dir_xcomp')

def registerPrismDeployTask = { String taskName, String platform, String versionDir, String prismDirProp ->
    tasks.register(taskName, Copy) {
        group = 'mystcraft'
        description = "Builds the ${platform.capitalize()} ${versionDir} jar and deploys it to a PrismLauncher instance configured via '${prismDirProp}'"
        dependsOn ":${platform}:${versionDir}:build"

        def prismDir = project.findProperty(prismDirProp)?.toString()?.trim()
        if (prismDir == null || prismDir.isEmpty()) {
            enabled = false
            return
        }

        def modsDir = "${prismDir}/minecraft/mods"
        def jarName = "MystcraftLegacy_${platform.capitalize()}-${versionDir}.jar"

        from(project(":${platform}:${versionDir}").layout.buildDirectory.dir('libs')) {
            include jarName
        }

        into(modsDir)

        doFirst {
            def targetDir = file(modsDir)
            if (!targetDir.exists()) {
                throw new GradleException(
                        "PrismLauncher mods directory does not exist:\n  ${targetDir.absolutePath}\n\n" +
                                "Make sure the instance exists in PrismLauncher and has been launched at least once " +
                                "so the 'minecraft/mods' folder is created (or update '${prismDirProp}' in gradle.properties)."
                )
            }
            def deleted = 0
            targetDir.listFiles()?.each { File f ->
                if (isMystcraftReleaseJar(f)) {
                    if (f.delete()) {
                        deleted++
                    }
                }
            }
            if (deleted > 0) {
                println "Deleted ${deleted} old Mystcraft jar(s) from: ${targetDir.absolutePath}"
            }
            println "Deploying ${jarName} to: ${targetDir.absolutePath}"
        }
    }
}

registerPrismDeployTask('deployToPrismFabric', 'fabric', '1.20.1', 'prism_fabric_dir')
registerPrismDeployTask('deployToPrismForge', 'forge', '1.20.1', 'prism_forge_dir')

tasks.register('buildAll') {
    group = 'build'
    description = 'Cleans, builds the supported 1.20.1 jars, and copies them to build_output_dir'
    dependsOn 'cleanLibs', 'buildAllVersions', 'copyBuilds'
}

