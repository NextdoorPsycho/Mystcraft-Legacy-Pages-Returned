plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

tasks.register('cleanLibs') {
    group = 'build'
    description = 'Cleans libs directories and output directory'

    doLast {
        def platforms = ['fabric:1.20.1', 'forge:1.20.1']
        platforms.each { platform ->
            try {
                def libsDir = project(":${platform}").file('build/libs')
                if (libsDir.exists()) {
                    libsDir.listFiles()?.findAll { it.name.endsWith('.jar') }?.each { it.delete() }
                    println "Cleaned ${platform}/build/libs"
                }
            } catch (Exception e) {
                // Subproject may not exist
            }
        }

        def outputDirs = [
                project.findProperty('build_output_dir')?.toString()?.trim(),
                project.findProperty('build_output_dir_psycho')?.toString()?.trim(),
                project.findProperty('build_output_dir_xcomp')?.toString()?.trim()
        ].findAll { it != null && !it.isEmpty() }.unique()
        outputDirs.each { dir ->
            def targetDir = file(dir)
            if (targetDir.exists()) {
                targetDir.listFiles()?.findAll { it.name.endsWith('.jar') }?.each { it.delete() }
                println "Cleaned output directory: ${targetDir.absolutePath}"
            }
        }
    }
}

// Build tasks
tasks.register('buildAllVersions') {
    group = 'build'
    description = 'Builds the supported 1.20.1 Fabric and Forge jars'
    dependsOn ':fabric:1.20.1:build', ':forge:1.20.1:build'
    mustRunAfter 'cleanLibs'
}

// Copy task helper
def registerCopyTask = { String name, String outputProp ->
    tasks.register(name, Copy) {
        group = 'build'
        description = "Copies built jars to ${outputProp}"
        dependsOn 'buildAllVersions'
        mustRunAfter 'cleanLibs'

        def outputDir = project.findProperty(outputProp)?.toString()?.trim()
        if (outputDir == null || outputDir.isEmpty()) {
            enabled = false
            return
        }

        from(project(':fabric:1.20.1').layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources*'
            exclude '*-dev.jar'
        }
        from(project(':forge:1.20.1').layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources*'
            exclude '*-all.jar'
        }

        into(outputDir)

        doFirst {
            def targetDir = file(outputDir)
            if (!targetDir.exists()) {
                targetDir.mkdirs()
                println "Created output directory: ${targetDir.absolutePath}"
            }
            // Remove old Mystcraft jars to avoid accidentally grabbing stale builds.
            def deleted = 0
            targetDir.listFiles()?.each { File f ->
                if ((f.name.startsWith('MystcraftLegacy_') || f.name.startsWith('mystcraft_legacy')) && f.name.endsWith('.jar')) {
                    if (f.delete()) {
                        deleted++
                    }
                }
            }
            if (deleted > 0) {
                println "Deleted ${deleted} old Mystcraft jars from: ${targetDir.absolutePath}"
            }
            println "Copying jars to: ${targetDir.absolutePath}"
        }
    }
}

registerCopyTask('copyBuilds', 'build_output_dir')
registerCopyTask('copyPsychoBuilds', 'build_output_dir_psycho')
registerCopyTask('copyXCompBuilds', 'build_output_dir_xcomp')

// PrismLauncher deploy task helper
// Builds the platform jar and copies it into <prismDir>/minecraft/mods.
// `prismDirProp` should point at the PrismLauncher instance root, e.g.
//   /Users/<you>/Library/Application Support/PrismLauncher/instances/Fabric-1.20.1
def registerPrismDeployTask = { String taskName, String platform, String versionDir, String prismDirProp ->
    tasks.register(taskName, Copy) {
        group = 'mystcraft'
        description = "Builds the ${platform.capitalize()} ${versionDir} jar and deploys it to a PrismLauncher instance configured via '${prismDirProp}'"
        dependsOn ":${platform}:${versionDir}:build"

        def prismDir = project.findProperty(prismDirProp)?.toString()?.trim()
        if (prismDir == null || prismDir.isEmpty()) {
            enabled = false
            return
        }

        def modsDir = "${prismDir}/minecraft/mods"
        def jarName = "MystcraftLegacy_${platform.capitalize()}-${versionDir}.jar"

        from(project(":${platform}:${versionDir}").layout.buildDirectory.dir('libs')) {
            include jarName
        }

        into(modsDir)

        doFirst {
            def targetDir = file(modsDir)
            if (!targetDir.exists()) {
                throw new GradleException(
                        "PrismLauncher mods directory does not exist:\n  ${targetDir.absolutePath}\n\n" +
                        "Make sure the instance exists in PrismLauncher and has been launched at least once " +
                        "so the 'minecraft/mods' folder is created (or update '${prismDirProp}' in gradle.properties)."
                )
            }
            // Remove old Mystcraft jars from the target so we don't keep stale builds alongside the new one.
            def deleted = 0
            targetDir.listFiles()?.each { File f ->
                if ((f.name.startsWith('MystcraftLegacy_') || f.name.startsWith('mystcraft_legacy')) && f.name.endsWith('.jar')) {
                    if (f.delete()) {
                        deleted++
                    }
                }
            }
            if (deleted > 0) {
                println "Deleted ${deleted} old Mystcraft jar(s) from: ${targetDir.absolutePath}"
            }
            println "Deploying ${jarName} to: ${targetDir.absolutePath}"
        }
    }
}

registerPrismDeployTask('deployToPrismFabric', 'fabric', '1.20.1', 'prism_fabric_dir')
registerPrismDeployTask('deployToPrismForge',  'forge',  '1.20.1', 'prism_forge_dir')

// Comprehensive build tasks
tasks.register('buildAll') {
    group = 'build'
    description = 'Cleans, builds the supported 1.20.1 jars, and copies them to build_output_dir'
    dependsOn 'cleanLibs', 'buildAllVersions', 'copyBuilds'
}

tasks.register('buildPsychoJars') {
    group = 'build'
    description = 'Builds the supported 1.20.1 jars and copies them to build_output_dir_psycho'
    dependsOn 'cleanLibs', 'buildAllVersions', 'copyPsychoBuilds'
}

tasks.register('buildXCompJars') {
    group = 'build'
    description = 'Builds the supported 1.20.1 jars and copies them to build_output_dir_xcomp'
    dependsOn 'cleanLibs', 'buildAllVersions', 'copyXCompBuilds'
}

subprojects {
    apply plugin: 'java'

    repositories {
        maven {
            name = 'Minecraft Libraries'
            url = 'https://libraries.minecraft.net'
            content {
                includeGroup 'org.lwjgl'
            }
        }
        mavenCentral {
            content {
                excludeGroup 'org.lwjgl'
            }
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net'
        }
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net'
        }
    }

    tasks.register('cleanAllWorlds') {
        group = 'mystcraft'
        description = 'Deletes the entire saves directory to ensure a fresh start.'
        doLast {
            def paths = [
                'runs/client/saves',
                'runs/saves',
                'run/saves',
                'run/client/saves'
            ]
            
            paths.each { path ->
                def dir = project.file(path)
                println "Checking for worlds at: ${dir.absolutePath}"
                if (dir.exists()) {
                    println "Found worlds directory. Deleting..."
                    try {
                        if (dir.deleteDir()) {
                             println "Successfully deleted: ${path}"
                        } else {
                             println "Java delete failed. Trying shell force delete..."
                             project.exec { commandLine 'rm', '-rf', dir.absolutePath }
                             println "Shell delete command executed for: ${path}"
                        }
                    } catch (Exception e) {
                        println "Error deleting ${path}: ${e.message}"
                    }
                }
            }
        }
    }

    java {
        def perProjectJava = project.findProperty("java_version_${project.name}") ?: java_version
        toolchain.languageVersion = JavaLanguageVersion.of(perProjectJava.toString())
        withSourcesJar()
    }

    jar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${mod_name}" }
        }
        manifest {
            attributes([
                    'Specification-Title'   : mod_name,
                    'Specification-Vendor'  : mod_author,
                    'Specification-Version' : project.jar.archiveVersion,
                    'Implementation-Title'  : project.name,
                    'Implementation-Version': project.jar.archiveVersion,
                    'Implementation-Vendor' : mod_author,
                    'Built-On-Minecraft'    : minecraft_version
            ])
        }
    }

    sourcesJar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${mod_name}" }
        }
    }

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    processResources {
        def expandProps = [
            'version'                   : version,
            'group'                     : project.group,
            'minecraft_version'         : minecraft_version,
            'minecraft_version_range'   : minecraft_version_range,
            'fabric_version'            : fabric_version,
            'fabric_loader_version'     : fabric_loader_version,
            'forge_version'             : forge_version,
            'forge_loader_version_range': forge_loader_version_range,
            'mod_name'                  : mod_name,
            'mod_author'                : mod_author,
            'mod_id'                    : mod_id,
            'license'                   : license,
            'description'               : mod_description,
            'credits'                   : credits,
            'java_version'              : java_version
        ]
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml']) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }
}
