plugins {
    id 'java'
}

// Common module is a SOURCE provider only - platform modules compile sources directly
// with their own version-specific exclusions. We skip Java compilation here because
// too many files have cascading dependencies on platform-specific classes.
tasks.named('compileJava') {
    enabled = false
}

tasks.named('classes') {
    enabled = false
}

tasks.named('jar') {
    enabled = false
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
