plugins {
    id 'java'
}

// Common module is a SOURCE provider only - platform modules compile sources directly
// with their own version-specific exclusions. We skip Java compilation here because
// too many files have cascading dependencies on platform-specific classes.
tasks.named('compileJava') {
    enabled = false
}

tasks.named('classes') {
    enabled = false
}

tasks.named('jar') {
    enabled = false
}

// IDE-only classpath to make symbols resolve in IntelliJ.
// This does not affect platform builds because common is only a source provider
// (compileJava, classes, and jar tasks are all disabled above).
dependencies {
    // Minecraft base
    compileOnly "com.mojang:minecraft:${minecraft_version_1_20_4}"

    // Fabric Loader + API (for IDE resolution of Fabric classes)
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version_1_20_4}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_version_1_20_4}"

    // Forge (for IDE resolution of Forge classes)
    compileOnly "net.minecraftforge:forge:${minecraft_version_1_20_4}-${forge_version_1_20_4}"

    // Night Config (used for TOML config parsing)
    compileOnly "com.electronwill.night-config:core:3.6.7"
    compileOnly "com.electronwill.night-config:toml:3.6.7"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
