plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
}

version = "${project.version}"
group = project.group

base {
    archivesName = "mystcraft_legacy-${version}-${minecraft_version_1_18_2}-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// Force Java 17 for all run tasks (client, server, gametest)
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

loom {
    // Use 1.18.2-specific access widener
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName("Fabric 1.18.2 Client")
            ideConfigGenerated(false)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric 1.18.2 Server")
            ideConfigGenerated(false)
            runDir("runs/server")
        }
        gametest {
            server()
            setConfigName("Fabric 1.18.2 GameTest")
            ideConfigGenerated(false)
            runDir("runs/gametest")
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {

    minecraft "com.mojang:minecraft:${minecraft_version_1_18_2}"

    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1_18_2}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version_1_18_2}"

    compileOnly project(':common')

    // Floo_Powder sources are compiled directly as part of this module



    // TOML config library (same as Forge/NeoForge use)
    implementation "com.electronwill.night-config:core:3.6.7"
    implementation "com.electronwill.night-config:toml:3.6.7"
    include "com.electronwill.night-config:core:3.6.7"
    include "com.electronwill.night-config:toml:3.6.7"
}

tasks.named('compileJava', JavaCompile) {
    // Add common sources with exclusions for 1.20.x-specific classes and platform-specific overrides
    source(project(':common').sourceSets.main.allSource.matching {
        exclude '**/gametest/**'
        exclude '**/client/screen/**'
        // Note: client/gui/element is NOW INCLUDED (uses IFlooGraphics abstraction)
        exclude '**/client/GuidebookClientHelper.java'
        exclude '**/client/render/PageRenderHelper.java'
        exclude '**/client/render/PageItemRendererBEWLR.java'
        exclude '**/advancements/EnterMystDimensionSafeTrigger.java'
        exclude '**/advancements/EnterMystDimensionQuinnTrigger.java'
        exclude '**/advancements/WritingDeskWriteTrigger.java'
        // Platform-specific packet implementations (use access widener for direct field access)
        exclude '**/network/LecternBookSyncPacket.java'
        // GuiGraphics doesn't exist in 1.18.2 - use PoseStack reimplementations
        exclude '**/platform/services/IClientHelper.java'
        // 1.20.x uses BuiltInRegistries/Registries which don't exist in 1.18.2
        exclude '**/world/AgeDimensionFactory.java'
        exclude '**/world/PersonalPocketDimension.java'
        exclude '**/world/gen/AgeChunkGenerator.java'
        exclude '**/world/gen/populate/BlockShufflePopulator.java'
        exclude '**/world/gen/biome/BiomeControllerBase.java'
        exclude '**/world/gen/biome/BiomeControllerNative.java'
        exclude '**/world/gen/biome/AgeBiomeSource.java'
        exclude '**/datapack/symbol/PopulatorRegistry.java'
        exclude '**/datapack/symbol/TerrainAlterationRegistry.java'
        exclude '**/datapack/symbol/SymbolLogicTypes.java'
        exclude '**/datapack/symbol/SymbolDatapackLoader.java'
        exclude '**/registry/ModTags.java'
        exclude '**/data/LinkOptions.java'
        // 1.20.x uses joml Matrix4f and Axis which don't exist in 1.18.2
        exclude '**/world/celestial/AbstractCelestial.java'
        exclude '**/world/celestial/CelestialStars.java'
        exclude '**/world/celestial/CelestialMoon.java'
        exclude '**/world/celestial/CelestialSun.java'
        exclude '**/client/AgeDimensionSpecialEffects.java'
        exclude '**/client/renderer/ColoredLightningRenderer.java'
        exclude '**/client/renderer/MeteorEntityRenderer.java'
        exclude '**/client/renderer/LinkPortalRenderer.java'
        exclude '**/client/renderer/StarFissureRenderer.java'
        exclude '**/client/renderer/WritingDeskRenderer.java'
        // MapColor vs MaterialColor
        exclude '**/registry/BlockDefinitions.java'
        // DamageTypes registry
        exclude '**/event/AgeDeathHandler.java'
        // Additional renderers using 1.20.x Axis class
        exclude '**/client/renderer/LinkbookEntityRenderer.java'
        exclude '**/client/renderer/BookstandRenderer.java'
        exclude '**/client/renderer/BookReceptacleRenderer.java'
        exclude '**/client/renderer/LecternRenderer.java'
        // Render helpers - use platform-specific versions
        exclude '**/client/render/DrawableWord.java'
        exclude '**/client/render/DrawableWordManager.java'
        // Entities using 1.20.x APIs (getAddEntityPacket is abstract in 1.18.2)
        exclude '**/entity/LinkbookEntity.java'
        exclude '**/entity/MystcraftFallingBlockEntity.java'
        exclude '**/entity/MeteorEntity.java'
        // Populators using 1.20.x APIs (isSolid, setEntityId) - exclude ALL populators
        exclude '**/world/gen/populate/**'
        // LinkingManager uses level(), serverLevel(), BlockPos.containing(), blocksMotion()
        exclude '**/link/LinkingManager.java'
        // Commands use level() - 1.20.x API
        exclude '**/command/MystcraftCommands.java'
        // Event handlers using 1.20.x APIs (level(), serverLevel())
        exclude '**/event/AgeReturnHandler.java'
        exclude '**/event/AgeEffectsHandler.java'
        exclude '**/event/AgeDataSyncHandler.java'
        exclude '**/event/PersonalPocketEscapeHandler.java'
        // Instability - use level()
        exclude '**/instability/bonus/PlayerKilledBonus.java'
        exclude '**/instability/bonus/PlayerSurvivalBonus.java'
        exclude '**/instability/effects/EffectErosion.java'
        // Blocks using damageSources()
        exclude '**/block/DecayBlock.java'
        // Menus using setByPlayer and level()
        exclude '**/menu/FolderMenu.java'
        exclude '**/menu/PortfolioMenu.java'
        exclude '**/menu/InkMixerMenu.java'
        exclude '**/menu/BookBinderMenu.java'
        exclude '**/menu/LinkModifierMenu.java'
        exclude '**/menu/WritingDeskMenu.java'
        // World using isSolid()
        exclude '**/world/AgeDirectorImpl.java'
        // Network packets using level()
        exclude '**/network/OpenBookPacket.java'
        exclude '**/network/LinkBookActivatePacket.java'
        exclude '**/network/EntityBookActivatePacket.java'
        exclude '**/network/BlockBookActivatePacket.java'
        // 1.20.x blocks (CHERRY_PLANKS, BAMBOO_PLANKS) and biomes (CHERRY_GROVE)
        exclude '**/grammar/AgeBuilder.java'
        exclude '**/world/gen/terrain/TerrainGeneratorNormal.java'
        // Instability effects using ExplosionInteraction enum
        exclude '**/instability/effects/EffectExplosion.java'
        // LecternBlock.resetBookState signature changed in 1.20.x (added Player param)
        exclude '**/util/MystcraftLecternHelper.java'
        // WritingDeskBlock uses canBeReplaced() which requires params in 1.18.2
        exclude '**/block/WritingDeskBlock.java'
        // Structure classes use 1.20.x Structure API
        exclude '**/world/structure/**'
        // API interfaces using RandomSource (doesn't exist in 1.18.2)
        exclude '**/api/world/logic/IPopulate.java'
        exclude '**/api/world/logic/ITerrainAlteration.java'
        exclude '**/api/world/logic/ITerrainGenerator.java'
        // Network packets using LinkEffectType
        exclude '**/network/LinkEffectPacket.java'
        // RandomSource doesn't exist in 1.18.2 (uses java.util.Random instead)
        // Exclude entire world/gen directory as most files use RandomSource
        exclude '**/world/gen/**'
        // SymbolRegistry uses RandomSource
        exclude '**/symbol/SymbolRegistry.java'
        // More files using RandomSource
        exclude '**/world/AgePopulationHandler.java'
        exclude '**/instability/InstabilityManager.java'
        exclude '**/client/render/PageBakedModel.java'
        exclude '**/villager/ArchivistTradeListings.java'
        // BoosterPackItem uses RandomSource
        exclude '**/item/BoosterPackItem.java'
        // Component.translatable() doesn't exist in 1.18.2 - use TranslatableComponent
        exclude '**/item/PageItem.java'
        exclude '**/blockentity/InkMixerBlockEntity.java'
        exclude '**/blockentity/BookBinderBlockEntity.java'
        exclude '**/blockentity/WritingDeskBlockEntity.java'
        exclude '**/blockentity/LinkModifierBlockEntity.java'
        // Item classes using Component.literal/translatable
        exclude '**/item/AgebookItem.java'
        exclude '**/item/LinkbookItem.java'
        exclude '**/item/GuidebookItem.java'
        exclude '**/item/FolderItem.java'
        exclude '**/item/PortfolioItem.java'
        exclude '**/item/InkVialItem.java'
        // Data classes using Component.literal
        exclude '**/data/Page.java'
        // Client classes using Resource.open() (1.20.x API)
        exclude '**/client/render/PageItemRenderer.java'
        exclude '**/client/render/PageSpriteUploader.java'
        exclude '**/client/PocketHeadClientSync.java'
        // Block using Component.translatable
        exclude '**/block/LinkPortalBlock.java'
        // Data using Items.ECHO_SHARD (1.19+)
        exclude '**/data/InkEffects.java'
        // PersonalLinkBookItem using Component
        exclude '**/item/PersonalLinkBookItem.java'
        // Instability effects using nextIntBetweenInclusive
        exclude '**/instability/effects/EffectLightning.java'
        exclude '**/instability/effects/EffectMeteor.java'
        // ContainerActionPacket depends on excluded Page and LinkOptions
        exclude '**/network/ContainerActionPacket.java'
        // OpenLecternBookPacket has version-specific dependencies
        exclude '**/network/OpenLecternBookPacket.java'
        // Block entities depending on excluded classes
        exclude '**/blockentity/BookstandBlockEntity.java'
        exclude '**/blockentity/BookReceptacleBlockEntity.java'
        // PocketHeadSyncPacket depends on AgeChunkGenerator
        exclude '**/network/PocketHeadSyncPacket.java'
        // Client gui elements depending on excluded classes (Page, SymbolRegistry)
        exclude '**/client/gui/element/MystGuiElement.java'
        exclude '**/client/gui/element/MystGuiPageSurface.java'
        exclude '**/client/gui/element/MystGuiScrollablePages.java'
        // PortalUtils depends on LinkPortalBlock
        exclude '**/portal/PortalUtils.java'
        // MystcraftAPI depends on SymbolRegistry
        exclude '**/api/MystcraftAPI.java'
        // Client utils depending on AgeDimensionFactory
        exclude '**/client/AgeColorUtils.java'
        // Event handler depending on AgeDimensionFactory
        exclude '**/event/FallingBlockHandler.java'
        // Instability bonus depending on AgeDimensionFactory
        exclude '**/instability/bonus/PlayerBonusProvider.java'
        // LinkbookUnlinkedItem depends on Page
        exclude '**/item/LinkbookUnlinkedItem.java'
        // TerrainGeneratorRegistry depends on world.gen.terrain
        exclude '**/datapack/symbol/TerrainGeneratorRegistry.java'
    })
    // Include Floo_Powder common API and adapter sources
    source(fileTree(rootProject.file('Floo_Powder/common/src/main/java')))
    source(fileTree(rootProject.file('Floo_Powder/fabric/1.18.2/src/main/java')))
    // The module's own src/main/java sources (including 1.18.2-specific screens)
    // are automatically included via sourceSets.main
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // Common resources first, then own resources to override
    from project(':common').sourceSets.main.resources
    from sourceSets.main.resources

    def expandProps = [
            'version'                : version,
            'group'                  : project.group,
            'minecraft_version'      : minecraft_version_1_18_2,
            'minecraft_version_range': minecraft_version_range_1_18_2,
            'fabric_version'         : fabric_version_1_18_2,
            'fabric_loader_version'  : fabric_loader_version_1_18_2,
            'mod_name'               : mod_name,
            'mod_author'             : mod_author,
            'mod_id'                 : mod_id,
            'license'                : license,
            'description'            : project.findProperty('description'),
            'credits'                : credits,
            'java_version'           : java_version_1_18_2
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)

    // Fix the problematic properties that get overridden by Gradle's built-in properties
    doLast {
        def fabricModJson = file("${destinationDir}/fabric.mod.json")
        if (fabricModJson.exists()) {
            def content = fabricModJson.text
            content = content.replace('"minecraft": "~1.20.2"', '"minecraft": "~1.18.2"')
            content = content.replace('"description": "Processes main resources."', '"description": "Mystcraft 2 Legacy - Pages Returned brings the Myst series to Minecraft, allowing players to write and travel to custom Ages (dimensions)."')
            fabricModJson.text = content
        }
    }
}

tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':common').sourceSets.main.allSource
    from project(':common').sourceSets.main.resources
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "mystcraft_legacy-fabric-${fabric_loader_version_1_18_2}-${minecraft_version_1_18_2}-dev.jar"

    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version_1_18_2
        ])
    }
}

remapJar {
    archiveFileName = "mystcraft_legacy-fabric-${fabric_loader_version_1_18_2}-${minecraft_version_1_18_2}.jar"
}

sourcesJar {
    archiveFileName = "mystcraft_legacy-fabric-${fabric_loader_version_1_18_2}-${minecraft_version_1_18_2}-sources-dev.jar"
}

remapSourcesJar {
    archiveFileName = "mystcraft_legacy-fabric-${fabric_loader_version_1_18_2}-${minecraft_version_1_18_2}-sources.jar"
}
