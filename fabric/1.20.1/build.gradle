plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
}

version = "${project.version}"
group = project.group

base {
    archivesName = "mystcraft_legacy-${version}-${minecraft_version_1_20_1}-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// Force Java 17 for all run tasks (client, server, gametest)
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

loom {
    // Use 1.20.1-specific access widener with different CriteriaTriggers signature
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName("Fabric 1.20.1 Client")
            ideConfigGenerated(false)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric 1.20.1 Server")
            ideConfigGenerated(false)
            runDir("runs/server")
        }
        gametest {
            server()
            setConfigName("Fabric 1.20.1 GameTest")
            ideConfigGenerated(false)
            runDir("runs/gametest")
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_1_20_1}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1_20_1}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version_1_20_1}"
    compileOnly project(':common')

    // TOML config library (same as Forge/NeoForge use)
    implementation "com.electronwill.night-config:core:3.6.7"
    implementation "com.electronwill.night-config:toml:3.6.7"
    include "com.electronwill.night-config:core:3.6.7"
    include "com.electronwill.night-config:toml:3.6.7"
}

tasks.named('compileJava', JavaCompile) {
    source(project(':common').sourceSets.main.allSource.matching {
        exclude '**/gametest/**'
        // Use 1.20.1-specific client helper
        exclude '**/platform/FabricClientHelper.java'
        // Use 1.20.1-specific advancement triggers
        exclude '**/advancements/EnterMystDimensionSafeTrigger.java'
        exclude '**/advancements/EnterMystDimensionQuinnTrigger.java'
        exclude '**/advancements/WritingDeskWriteTrigger.java'
        // Use 1.20.1-specific screens with legacy renderBackground signature
        exclude '**/client/screen/BookScreen.java'
        exclude '**/client/screen/GuidebookScreen.java'
        // Platform-specific packet implementations (use access widener for direct field access)
        exclude '**/network/LecternBookSyncPacket.java'
    })
    source(fileTree("${rootDir}/fabric/shared/src/main/java") {
        exclude '**/platform/FabricAdvancementTriggerFactory.java'
        exclude '**/platform/FabricClientHelper.java'
        exclude '**/platform/FabricVersionHelper.java'
    })
    source(sourceSets.main.java)
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // Common resources first, then own resources to override
    from project(':common').sourceSets.main.resources
    from sourceSets.main.resources

    def expandProps = [
            'version'                : version,
            'group'                  : project.group,
            'minecraft_version'      : minecraft_version_1_20_1,
            'minecraft_version_range': minecraft_version_range_1_20_1,
            'fabric_version'         : fabric_version_1_20_1,
            'fabric_loader_version'  : fabric_loader_version_1_20_1,
            'mod_name'               : mod_name,
            'mod_author'             : mod_author,
            'mod_id'                 : mod_id,
            'license'                : license,
            'description'            : project.findProperty('description'),
            'credits'                : credits,
            'java_version'           : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)

    // Fix the problematic properties that get overridden by Gradle's built-in properties
    doLast {
        def fabricModJson = file("${destinationDir}/fabric.mod.json")
        if (fabricModJson.exists()) {
            def content = fabricModJson.text
            content = content.replace('"minecraft": "~1.20.2"', '"minecraft": "~1.20.1"')
            content = content.replace('"description": "Processes main resources."', '"description": "Mystcraft 2 Legacy - Pages Returned brings the Myst series to Minecraft, allowing players to write and travel to custom Ages (dimensions)."')
            fabricModJson.text = content
        }
    }
}

tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':common').sourceSets.main.allSource
    from project(':common').sourceSets.main.resources
    from fileTree("${rootDir}/fabric/shared/src/main/java") {
        exclude '**/platform/FabricAdvancementTriggerFactory.java'
        exclude '**/platform/FabricClientHelper.java'
        exclude '**/platform/FabricVersionHelper.java'
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "mystcraft_legacy-fabric-${fabric_loader_version_1_20_1}-${minecraft_version_1_20_1}-dev.jar"

    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version_1_20_1
        ])
    }
}

remapJar {
    archiveFileName = "mystcraft_legacy-fabric-${fabric_loader_version_1_20_1}-${minecraft_version_1_20_1}.jar"
}

sourcesJar {
    archiveFileName = "mystcraft_legacy-fabric-${fabric_loader_version_1_20_1}-${minecraft_version_1_20_1}-sources-dev.jar"
}

remapSourcesJar {
    archiveFileName = "mystcraft_legacy-fabric-${fabric_loader_version_1_20_1}-${minecraft_version_1_20_1}-sources.jar"
}
