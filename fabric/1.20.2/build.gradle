plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
}

version = "${project.version}"
group = project.group

base {
    archivesName = "mystcraft_legacy-${version}-${minecraft_version_1_20_2}-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// Force Java 17 for all run tasks (client, server, gametest)
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

loom {
    accessWidenerPath = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName("Fabric 1.20.2 Client")
            ideConfigGenerated(false)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric 1.20.2 Server")
            ideConfigGenerated(false)
            runDir("runs/server")
        }
        gametest {
            server()
            setConfigName("Fabric 1.20.2 GameTest")
            ideConfigGenerated(false)
            runDir("runs/gametest")
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {

    minecraft "com.mojang:minecraft:${minecraft_version_1_20_2}"

    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1_20_2}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version_1_20_2}"

    compileOnly project(':common')

    // Floo_Powder sources are compiled directly as part of this module

    // TOML config library (same as Forge/NeoForge use)
    implementation "com.electronwill.night-config:core:3.6.7"
    implementation "com.electronwill.night-config:toml:3.6.7"
    include "com.electronwill.night-config:core:3.6.7"
    include "com.electronwill.night-config:toml:3.6.7"
}

tasks.named('compileJava', JavaCompile) {
    source(project(':common').sourceSets.main.allSource.matching {
        // Platform-specific packet implementations (use access widener for direct field access)
        exclude '**/network/LecternBookSyncPacket.java'
    })
    // Include Floo_Powder common API
    source(fileTree(rootProject.file('Floo_Powder/common/src/main/java')))
    // Include Floo_Powder fabric 1.20.2 adapter sources
    source(fileTree(rootProject.file('Floo_Powder/fabric/1.20.2/src/main/java')))
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from project(':common').sourceSets.main.resources
    from sourceSets.main.resources

    def expandProps = [
            'version'                : version,
            'group'                  : project.group,
            'minecraft_version'      : minecraft_version_1_20_2,
            'minecraft_version_range': minecraft_version_range_1_20_2,
            'fabric_version'         : fabric_version_1_20_2,
            'fabric_loader_version'  : fabric_loader_version_1_20_2,
            'mod_name'               : mod_name,
            'mod_author'             : mod_author,
            'mod_id'                 : mod_id,
            'license'                : license,
            'description'            : description,
            'credits'                : credits,
            'java_version'           : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':common').sourceSets.main.allSource
    from project(':common').sourceSets.main.resources
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "mystcraft_legacy-${version}-${minecraft_version_1_20_2}-fabric-${fabric_loader_version_1_20_2}-dev.jar"

    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version_1_20_2
        ])
    }
}

remapJar {
    archiveFileName = "mystcraft_legacy-${version}-${minecraft_version_1_20_2}-fabric-${fabric_loader_version_1_20_2}.jar"
}

sourcesJar {
    archiveFileName = "Mystcraft Legacy - ${version} - Fabric-1.20.2-sources-dev.jar"
}

remapSourcesJar {
    archiveFileName = "Mystcraft Legacy - ${version} - Fabric-1.20.2-sources.jar"
}
