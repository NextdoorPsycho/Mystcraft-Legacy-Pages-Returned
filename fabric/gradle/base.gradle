jar {
    archiveFileName = "mystcraft_legacy-${version}-${minecraft_version}-fabric-${fabric_loader_version}-dev.jar"
}

remapJar {
    archiveFileName = "mystcraft_legacy-${version}-${minecraft_version}-fabric-${fabric_loader_version}.jar"
}

sourcesJar {
    archiveFileName = "Mystcrafy Legacy - ${version} - Fabric-sources-dev.jar"
}

remapSourcesJar {
    archiveFileName = "Mystcrafy Legacy - ${version} - Fabric-sources.jar"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly project(':common')

    // TOML config library (same as Forge/NeoForge use)
    implementation "com.electronwill.night-config:core:3.6.7"
    implementation "com.electronwill.night-config:toml:3.6.7"
    include "com.electronwill.night-config:core:3.6.7"
    include "com.electronwill.night-config:toml:3.6.7"
}
