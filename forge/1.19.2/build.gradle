plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

configurations {
    shadow
    implementation.extendsFrom shadow
}

version = "${project.version}"
group = project.group

base {
    archivesName = "mystcraft_legacy-${version}-${minecraft_version_1_19_2}-forge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// Force Java 17 for all run tasks (client, server, gametest, data)
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version_1_19_2

    copyIdeResources = true

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        configureEach {
            workingDirectory project.file('runs')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                mystcraft {
                    // Only include local sourceSets.main - it already contains common sources
                    // compiled against 1.19.2 jars via the compileJava task configuration
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.gameTestServer', 'true'
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
    maven {
        name = 'Sponge / Mixin'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version_1_19_2}-${forge_version_1_19_2}"
    compileOnly project(':common')

    // Floo_Powder sources are compiled directly as part of this module

    annotationProcessor("org.spongepowered:mixin:0.8.5:processor")
}

shadowJar {
    configurations = [project.configurations.shadow]
    relocate 'com.floopowder', 'com.mystcraft.lib.floopowder'
    archiveClassifier = '' // Replace the main jar
}

reobf {
    shadowJar {} // Reobfuscate the shadow jar
}

tasks.named('compileJava', JavaCompile) {
    // Add common sources with exclusions for 1.20.x-specific classes and platform-specific overrides
    source(project(':common').sourceSets.main.allSource.matching {
        exclude '**/gametest/**'
        exclude '**/client/screen/**'
        exclude '**/client/GuidebookClientHelper.java'
        exclude '**/client/render/PageRenderHelper.java'
        exclude '**/client/render/PageItemRendererBEWLR.java'
        exclude '**/advancements/EnterMystDimensionSafeTrigger.java'
        exclude '**/advancements/EnterMystDimensionQuinnTrigger.java'
        exclude '**/advancements/WritingDeskWriteTrigger.java'
        // Platform-specific packet implementations
        exclude '**/network/LecternBookSyncPacket.java'
        // GuiGraphics doesn't exist in 1.19.2 - use PoseStack reimplementations
        exclude '**/platform/services/IClientHelper.java'
        // 1.20.x uses BuiltInRegistries/Registries which don't exist in 1.19.2
        exclude '**/world/AgeDimensionFactory.java'
        exclude '**/world/PersonalPocketDimension.java'
        exclude '**/world/gen/AgeChunkGenerator.java'
        exclude '**/world/gen/populate/BlockShufflePopulator.java'
        exclude '**/world/gen/biome/BiomeControllerBase.java'
        exclude '**/world/gen/biome/BiomeControllerNative.java'
        exclude '**/world/gen/biome/AgeBiomeSource.java'
        exclude '**/datapack/symbol/PopulatorRegistry.java'
        exclude '**/datapack/symbol/TerrainAlterationRegistry.java'
        exclude '**/datapack/symbol/SymbolLogicTypes.java'
        exclude '**/datapack/symbol/SymbolDatapackLoader.java'
        exclude '**/registry/ModTags.java'
        exclude '**/data/LinkOptions.java'
        // 1.20.x uses joml Matrix4f and Axis which don't exist in 1.19.2
        exclude '**/world/celestial/CelestialStars.java'
        exclude '**/world/celestial/CelestialMoon.java'
        exclude '**/world/celestial/CelestialSun.java'
        exclude '**/client/AgeDimensionSpecialEffects.java'
        exclude '**/client/renderer/ColoredLightningRenderer.java'
        exclude '**/client/renderer/MeteorEntityRenderer.java'
        exclude '**/client/renderer/LinkPortalRenderer.java'
        exclude '**/client/renderer/StarFissureRenderer.java'
        exclude '**/client/renderer/WritingDeskRenderer.java'
        // MapColor vs MaterialColor
        exclude '**/registry/BlockDefinitions.java'
        // DamageTypes registry
        exclude '**/event/AgeDeathHandler.java'
        // Additional renderers using 1.20.x Axis class
        exclude '**/client/renderer/LinkbookEntityRenderer.java'
        exclude '**/client/renderer/BookstandRenderer.java'
        exclude '**/client/renderer/BookReceptacleRenderer.java'
        exclude '**/client/renderer/LecternRenderer.java'
        // DrawableWord and DrawableWordManager are pure data classes - NO EXCLUSION NEEDED
        // Entities using 1.20.x APIs (getAddEntityPacket is abstract in 1.19.2)
        exclude '**/entity/LinkbookEntity.java'
        exclude '**/entity/MystcraftFallingBlockEntity.java'
        exclude '**/entity/MeteorEntity.java'
        // Populators using 1.20.x APIs (isSolid, setEntityId) - exclude ALL populators
        exclude '**/world/gen/populate/**'
        // LinkingManager uses level(), serverLevel(), BlockPos.containing(), blocksMotion()
        exclude '**/link/LinkingManager.java'
        // Commands use level() - 1.20.x API
        exclude '**/command/MystcraftCommands.java'
        // Event handlers using 1.20.x APIs (level(), serverLevel())
        exclude '**/event/AgeReturnHandler.java'
        exclude '**/event/AgeEffectsHandler.java'
        exclude '**/event/AgeDataSyncHandler.java'
        exclude '**/event/PersonalPocketEscapeHandler.java'
        // Instability - use level()
        exclude '**/instability/bonus/PlayerKilledBonus.java'
        exclude '**/instability/bonus/PlayerSurvivalBonus.java'
        exclude '**/instability/effects/EffectErosion.java'
        // Blocks using damageSources()
        exclude '**/block/DecayBlock.java'
        // Menus using setByPlayer and level()
        exclude '**/menu/FolderMenu.java'
        exclude '**/menu/PortfolioMenu.java'
        exclude '**/menu/InkMixerMenu.java'
        exclude '**/menu/BookBinderMenu.java'
        exclude '**/menu/LinkModifierMenu.java'
        exclude '**/menu/WritingDeskMenu.java'
        // World using isSolid()
        exclude '**/world/AgeDirectorImpl.java'
        // Network packets using level()
        exclude '**/network/OpenBookPacket.java'
        exclude '**/network/LinkBookActivatePacket.java'
        exclude '**/network/EntityBookActivatePacket.java'
        exclude '**/network/BlockBookActivatePacket.java'
        // 1.20.x blocks (CHERRY_PLANKS, BAMBOO_PLANKS) and biomes (CHERRY_GROVE)
        exclude '**/grammar/AgeBuilder.java'
        exclude '**/world/gen/terrain/TerrainGeneratorNormal.java'
        exclude '**/world/gen/terrain/TerrainGeneratorBase.java'
        // Celestials - using version-specific copies for Matrix4f differences
        exclude '**/world/celestial/AbstractCelestial.java'
        // Additional instability effects with version-specific copies
        exclude '**/instability/effects/EffectLightning.java'
        exclude '**/instability/effects/EffectMeteor.java'
        // Instability effects using ExplosionInteraction enum
        exclude '**/instability/effects/EffectExplosion.java'
        // LecternBlock.resetBookState signature changed in 1.20.x (added Player param)
        exclude '**/util/MystcraftLecternHelper.java'
        // BlockEntities using BuiltInRegistries
        exclude '**/blockentity/BookBinderBlockEntity.java'
        // WritingDeskBlock uses canBeReplaced() which requires params in 1.19.2
        exclude '**/block/WritingDeskBlock.java'
        // Network packets - forge/1.19.2 has its own implementations
        exclude '**/network/SyncAgeDataPacket.java'
        exclude '**/network/ContainerActionPacket.java'
        exclude '**/network/LinkEffectPacket.java'
        exclude '**/network/ExplosionPacket.java'
        exclude '**/network/SymbolSyncPacket.java'
        exclude '**/network/ProfilingStatePacket.java'
        exclude '**/network/DimensionSyncPacket.java'
        exclude '**/network/PacketContext.java'
        exclude '**/network/PocketHeadSyncPacket.java'
        exclude '**/network/OpenLecternBookPacket.java'
        exclude '**/network/SpawnLightningPacket.java'
        exclude '**/network/ConfigSyncPacket.java'
        exclude '**/network/MystcraftNetwork.java'
        exclude '**/network/LecternBookSyncPacket.java'
        // Client utilities with network dependencies
        exclude '**/client/PocketHeadClientSync.java'
    })
    // Include Floo_Powder common API
    source(fileTree(rootProject.file('Floo_Powder/common/src/main/java')))
    // Include Floo_Powder forge 1.19.2 adapter sources
    source(fileTree(rootProject.file('Floo_Powder/forge/1.19.2/src/main/java')))
    // The module's own src/main/java sources (including 1.19.2-specific screens)
    // are automatically included via sourceSets.main
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from(project(':common').sourceSets.main.resources) {
        // Exclude common's AT - Forge needs SRG names, common uses Mojang names
        exclude 'META-INF/accesstransformer.cfg'
    }
    from sourceSets.main.resources

    def expandProps = [
            'version'                   : version,
            'group'                     : project.group,
            'minecraft_version'         : minecraft_version_1_19_2,
            'minecraft_version_range'   : minecraft_version_range_1_19_2,
            'forge_version'             : forge_version_1_19_2,
            'forge_loader_version_range': forge_loader_version_range_1_19_2,
            'mod_name'                  : mod_name,
            'mod_author'                : mod_author,
            'mod_id'                    : mod_id,
            'license'                   : license,
            'description'               : description,
            'credits'                   : credits,
            'java_version'              : java_version_1_19_2
    ]

    filesMatching(['pack.mcmeta', 'META-INF/mods.toml']) {
        expand expandProps
    }

    inputs.properties(expandProps)

    // Fix mods.toml for 1.19.2 (override problematic properties that Gradle expands incorrectly)
    doLast {
        def modsToml = file("${destinationDir}/META-INF/mods.toml")
        if (modsToml.exists()) {
            def content = modsToml.text
            // Fix loader version range
            content = content.replace('loaderVersion = "[48,)"', 'loaderVersion = "[43,)"')
            content = content.replace('loaderVersion = "[47,)"', 'loaderVersion = "[43,)"')
            // Fix minecraft version range
            content = content.replace('versionRange = "[1.20.2,1.21)"', 'versionRange = "[1.19.2,1.20)"')
            content = content.replace('versionRange = "[1.20.1,1.20.2)"', 'versionRange = "[1.19.2,1.20)"')
            // Fix forge version range
            content = content.replace('versionRange = "[48.1.0,)"', 'versionRange = "[43.0.0,)"')
            content = content.replace('versionRange = "[47.0.0,)"', 'versionRange = "[43.0.0,)"')
            // Fix description
            content = content.replace("description = '''Processes main resources.'''",
                    "description = '''Mystcraft 2 Legacy - Pages Returned brings the Myst series to Minecraft, allowing players to write and travel to custom Ages (dimensions).'''")
            modsToml.text = content
        }
    }
}

tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':common').sourceSets.main.allSource
    from project(':common').sourceSets.main.resources
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "mystcraft_legacy-forge-${forge_version_1_19_2}-${minecraft_version_1_19_2}.jar"

    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version_1_19_2
        ])
    }
}

sourcesJar {
    archiveFileName = "mystcraft_legacy-forge-${forge_version_1_19_2}-${minecraft_version_1_19_2}-sources.jar"
}

jar.finalizedBy('reobfJar')

// Disable IDE run configuration generation
tasks.matching { it.name.startsWith('genIntellijRuns') || it.name.startsWith('prepareRuns') }.configureEach {
    enabled = false
}
