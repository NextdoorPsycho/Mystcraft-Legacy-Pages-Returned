plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

configurations {
    shadow
    implementation.extendsFrom shadow
}

version = "${project.version}"
group = project.group

base {
    archivesName = "mystcraft_legacy-${version}-${minecraft_version_1_20_1}-forge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// Force Java 17 for all run tasks (client, server, gametest, data)
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version_1_20_1

    copyIdeResources = true

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        configureEach {
            workingDirectory project.file('runs')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                mystcraft {
                    // Only include local sourceSets.main - it already contains common sources
                    // compiled against 1.20.1 jars via the compileJava task configuration
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.gameTestServer', 'true'
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
    maven {
        name = 'Sponge / Mixin'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version_1_20_1}-${forge_version_1_20_1}"
    compileOnly project(':common')

    annotationProcessor("org.spongepowered:mixin:0.8.5:processor")
}

shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier = '' // Replace the main jar
}

reobf {
    shadowJar {} // Reobfuscate the shadow jar
}

tasks.named('compileJava', JavaCompile) {
    // Add common sources with exclusions for 1.20.2-specific classes
    source(project(':common').sourceSets.main.allSource.matching {
        // Only exclude screens that have platform-specific implementations in forge/1.20.1
        exclude '**/client/screen/BookScreen.java'
        exclude '**/client/screen/GuidebookScreen.java'
        exclude '**/client/GuidebookClientHelper.java'
        exclude '**/advancements/EnterMystDimensionSafeTrigger.java'
        exclude '**/advancements/EnterMystDimensionQuinnTrigger.java'
        exclude '**/advancements/WritingDeskWriteTrigger.java'
        // Platform-specific packet implementations (use ObfuscationReflectionHelper for SRG names)
        exclude '**/network/LecternBookSyncPacket.java'
        // Network packets - forge/1.20.1 has its own implementations
        exclude '**/network/SyncAgeDataPacket.java'
        exclude '**/network/PocketHeadSyncPacket.java'
        exclude '**/network/OpenLecternBookPacket.java'
    })
    source(project.fileTree("${rootDir}/forge/shared/src/main/java") {
        exclude '**/platform/ForgeAdvancementTriggerFactory.java'
        exclude '**/platform/ForgeClientHelper.java'
        exclude '**/platform/ForgePlatformHelper.java'
        exclude '**/platform/ForgeVersionHelper.java'
        exclude '**/network/ForgeMystcraftNetwork.java'
    })
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from(project(':common').sourceSets.main.resources) {
        // Exclude common's AT - Forge needs SRG names, common uses Mojang names
        exclude 'META-INF/accesstransformer.cfg'
    }
    from sourceSets.main.resources

    def expandProps = [
            'version'                   : version,
            'group'                     : project.group,
            'minecraft_version'         : minecraft_version_1_20_1,
            'minecraft_version_range'   : minecraft_version_range_1_20_1,
            'forge_version'             : forge_version_1_20_1,
            'forge_loader_version_range': forge_loader_version_range_1_20_1,
            'mod_name'                  : mod_name,
            'mod_author'                : mod_author,
            'mod_id'                    : mod_id,
            'license'                   : license,
            'description'               : description,
            'credits'                   : credits,
            'java_version'              : java_version
    ]

    filesMatching(['pack.mcmeta', 'META-INF/mods.toml']) {
        expand expandProps
    }

    inputs.properties(expandProps)

    // Fix mods.toml for 1.20.1 (override problematic properties that Gradle expands incorrectly)
    doLast {
        def modsToml = file("${destinationDir}/META-INF/mods.toml")
        if (modsToml.exists()) {
            def content = modsToml.text
            // Fix loader version range (Gradle global property [48,) -> [47,))
            content = content.replace('loaderVersion = "[48,)"', 'loaderVersion = "[47,)"')
            // Fix minecraft version range (1.20.2 -> 1.20.1)
            content = content.replace('versionRange = "[1.20.2,1.21)"', 'versionRange = "[1.20.1,1.20.2)"')
            // Fix forge version range (48.1.0 -> 47.0.0)
            content = content.replace('versionRange = "[48.1.0,)"', 'versionRange = "[47.0.0,)"')
            // Fix description (Gradle's task description leaks through)
            content = content.replace("description = '''Processes main resources.'''",
                    "description = '''Mystcraft 2 Legacy - Pages Returned brings the Myst series to Minecraft, allowing players to write and travel to custom Ages (dimensions).'''")
            modsToml.text = content
        }
    }
}

tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':common').sourceSets.main.allSource
    from project(':common').sourceSets.main.resources
    from fileTree("${rootDir}/forge/shared/src/main/java") {
        exclude '**/platform/ForgeAdvancementTriggerFactory.java'
        exclude '**/platform/ForgeClientHelper.java'
        exclude '**/platform/ForgePlatformHelper.java'
        exclude '**/platform/ForgeVersionHelper.java'
        exclude '**/network/ForgeMystcraftNetwork.java'
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "mystcraft_legacy-forge-${forge_version_1_20_1}-${minecraft_version_1_20_1}.jar"

    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version_1_20_1
        ])
    }
}

sourcesJar {
    archiveFileName = "mystcraft_legacy-forge-${forge_version_1_20_1}-${minecraft_version_1_20_1}-sources.jar"
}

jar.finalizedBy('reobfJar')

// Disable IDE run configuration generation
tasks.matching { it.name.startsWith('genIntellijRuns') || it.name.startsWith('prepareRuns') }.configureEach {
    enabled = false
}
