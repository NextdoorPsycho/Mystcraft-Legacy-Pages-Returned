# Mystcraft Access Transformer for Forge
# https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/

# MinecraftServer - Dynamic dimension creation
public-f net.minecraft.server.MinecraftServer levels
public-f net.minecraft.server.MinecraftServer executor
public net.minecraft.server.MinecraftServer storageSource

# MappedRegistry - Unfreeze for dimension registration
public-f net.minecraft.core.MappedRegistry frozen

# StructureTemplatePool - Village structure injection
public-f net.minecraft.world.level.levelgen.structure.pools.StructureTemplatePool rawTemplates
public-f net.minecraft.world.level.levelgen.structure.pools.StructureTemplatePool templates

# CriteriaTriggers - Custom advancement triggers
public net.minecraft.advancements.CriteriaTriggers register(Ljava/lang/String;Lnet/minecraft/advancements/CriterionTrigger;)Lnet/minecraft/advancements/CriterionTrigger;

# LecternBlockEntity - Book placement for Mystcraft books
public-f net.minecraft.world.level.block.entity.LecternBlockEntity book
public-f net.minecraft.world.level.block.entity.LecternBlockEntity pageCount
