plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

configurations {
    shadow
    implementation.extendsFrom shadow
}

version = "${project.version}"
group = project.group

base {
    archivesName = "MystcraftLegacy_Forge-${minecraft_version_1_20_4}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// Force Java 17 for all run tasks (client, server, gametest, data)
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version_1_20_4

    copyIdeResources = true

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        configureEach {
            workingDirectory project.file('runs')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                mystcraft {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.gameTestServer', 'true'
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
    maven {
        name = 'Sponge / Mixin'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name = 'Minecraft Libraries'
        url = 'https://libraries.minecraft.net'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version_1_20_4}-${forge_version_1_20_4}"
    compileOnly project(':common')

    annotationProcessor("org.spongepowered:mixin:0.8.5:processor")
}

shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier = ''
    archiveFileName = "MystcraftLegacy_Forge-${minecraft_version_1_20_4}.jar"
    dependsOn(tasks.named('jar'))
}

reobf {
    shadowJar {} // Reobfuscate the shadow jar
}

tasks.named('reobfShadowJar') {
    dependsOn(tasks.named('shadowJar'))
}

tasks.named('compileJava', JavaCompile) {
    source(project(':common').sourceSets.main.allSource.matching {
        // Platform-specific packet implementations (use ObfuscationReflectionHelper for SRG names)
        exclude '**/network/LecternBookSyncPacket.java'
        // Exclude classes incompatible with 1.20.4+ API changes
        exclude '**/advancements/EnterMystDimensionQuinnTrigger.java'
        exclude '**/advancements/EnterMystDimensionSafeTrigger.java'
        exclude '**/advancements/WritingDeskWriteTrigger.java'
        exclude '**/world/structure/AbandonedLibraryStructure.java'
        exclude '**/world/structure/UndergroundArchiveStructure.java'
        exclude '**/world/structure/ScatteredLibraryStructure.java'
        exclude '**/util/PocketHeadUtils.java'
    })
    source(file("${rootDir}/common/1.20.4/src/main/java"))
    source(project.fileTree("${rootDir}/forge/shared/src/main/java") {
        // Use local gametest with @GameTestDontPrefix instead of shared one with @PrefixGameTestTemplate
        exclude '**/gametest/MystcraftForgeGameTests.java'
    })
    source(sourceSets.main.java)
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from(project(':common').sourceSets.main.resources) {
        // Exclude common's AT - Forge needs SRG names, common uses Mojang names
        exclude 'META-INF/accesstransformer.cfg'
    }
    from sourceSets.main.resources

    def expandProps = [
            'version'                   : version,
            'group'                     : project.group,
            'minecraft_version'         : minecraft_version_1_20_4,
            'minecraft_version_range'   : minecraft_version_range_1_20_4,
            'forge_version'             : forge_version_1_20_4,
            'forge_loader_version_range': forge_loader_version_range_1_20_4,
            'mod_name'                  : mod_name,
            'mod_author'                : mod_author,
            'mod_id'                    : mod_id,
            'license'                   : license,
            'description'               : description,
            'credits'                   : credits,
            'java_version'              : java_version
    ]

    filesMatching(['pack.mcmeta', 'META-INF/mods.toml']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':common').sourceSets.main.allSource
    from project(':common').sourceSets.main.resources
    from file("${rootDir}/common/1.20.4/src/main/java")
    from file("${rootDir}/forge/shared/src/main/java")
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "MystcraftLegacy_Forge-${minecraft_version_1_20_4}-slim.jar"

    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version_1_20_4
        ])
    }
}

sourcesJar {
    archiveFileName = "MystcraftLegacy_Forge-${minecraft_version_1_20_4}-sources.jar"
}

shadowJar.finalizedBy('reobfShadowJar')

// Disable IDE run configuration generation
tasks.matching { it.name.startsWith('genIntellijRuns') || it.name.startsWith('prepareRuns') }.configureEach {
    enabled = false
}
