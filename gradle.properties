mod_license=LGPLv3
mod_version=1.0.0.0
mod_group_id=art.arcane.mystcraft
mod_authors=NextdoorPsycho
mod_description=Mystcraft Legacy - Pages Returned, is my continuation of the Mystcraft mod for Minecraft 1.20.2 and beyond.

