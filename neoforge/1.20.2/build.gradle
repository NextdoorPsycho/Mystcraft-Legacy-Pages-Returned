buildscript {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.neoforged.gradle:userdev:7.0.41"
    }
}

apply plugin: 'net.neoforged.gradle.userdev'

version = "${project.version}"
group = project.group

base {
    archivesName = "mystcraft_legacy-${version}-${minecraft_version_1_20_2}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

minecraft {
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.file at
    }
}

runs {
    configureEach {
        modSource project.sourceSets.main
        modSource project(':common').sourceSets.main
        modSource project(':neoforge').sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    data {
        programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version_1_20_2}"
    compileOnly project(':common')
    compileOnly project(':neoforge')
}

tasks.named('compileJava', JavaCompile) {
    source(project(':common').sourceSets.main.allSource)
    source(project(':neoforge').sourceSets.main.allSource)
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from project(':common').sourceSets.main.resources
    from project(':neoforge').sourceSets.main.resources
    from sourceSets.main.resources

    def expandProps = [
        'version'                 : version,
        'group'                   : project.group,
        'minecraft_version'       : minecraft_version_1_20_2,
        'minecraft_version_range' : minecraft_version_range_1_20_2,
        'neoforge_version'        : neoforge_version_1_20_2,
        'neoforge_loader_version_range': neoforge_loader_version_range_1_20_2,
        'mod_name'                : mod_name,
        'mod_author'              : mod_author,
        'mod_id'                  : mod_id,
        'license'                 : license,
        'description'             : description,
        'credits'                 : credits,
        'java_version'            : java_version
    ]

    filesMatching(['pack.mcmeta', 'META-INF/mods.toml']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':common').sourceSets.main.allSource
    from project(':common').sourceSets.main.resources
    from project(':neoforge').sourceSets.main.allSource
    from project(':neoforge').sourceSets.main.resources
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "mystcraft_legacy-${version}-${minecraft_version_1_20_2}-neoforge-${neoforge_version_1_20_2}.jar"

    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Vendor'  : mod_author,
            'Specification-Version' : project.jar.archiveVersion,
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor' : mod_author,
            'Built-On-Minecraft'    : minecraft_version_1_20_2
        ])
    }
}

sourcesJar {
    archiveFileName = "Mystcraft Legacy - ${version} - NeoForge-1.20.2-sources.jar"
}

// Disable NeoForge IDE post-sync task
tasks.matching { it.name == 'idePostSync' }.configureEach {
    enabled = false
}
