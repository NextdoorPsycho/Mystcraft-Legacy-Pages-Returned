plugins {
    id 'net.neoforged.moddev' version '2.0.140'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

configurations {
    shadow
    implementation.extendsFrom shadow
}

version = "${project.version}"
group = project.group
description = project.findProperty('description') ?: project.description
ext.minecraft_version = minecraft_version_1_20_4
ext.minecraft_version_range = minecraft_version_range_1_20_4
ext.neoforge_version = neoforge_version_1_20_4
ext.neoforge_loader_version_range = neoforge_loader_version_range_1_20_4

base {
    archivesName = "MystcraftLegacy_NeoForge-${minecraft_version_1_20_4}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

neoForge {
    version = neoforge_version_1_20_4

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at)
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.gameTestServer', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'neoforge.enableGameTest', 'true'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        mystcraft {
            // Only include local sourceSets.main - it already contains common sources
            // compiled via the compileJava task. Including project(':common') would
            // bring in Fabric's dependencies causing conflicts.
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

// Copy gametest structure files to the run directory so StructureUtils filesystem lookup finds them.
// NeoForge ModDev uses 'run/' as the working directory (--gameDir .).
tasks.register('copyGameTestStructures', Copy) {
    from 'src/main/resources/data/mystcraft/gameteststructures'
    into 'run/gameteststructures'
}
tasks.named('runGameTestServer').configure { dependsOn 'copyGameTestStructures' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    compileOnly project(':common')
}

shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier = ''
    archiveFileName = "MystcraftLegacy_NeoForge-${minecraft_version_1_20_4}.jar"
}

tasks.named('compileJava', JavaCompile) {
    source(project(':common').sourceSets.main.allSource.matching {
        exclude '**/network/LecternBookSyncPacket.java'
        // Exclude classes incompatible with 1.20.4+ API changes
        exclude '**/advancements/EnterMystDimensionQuinnTrigger.java'
        exclude '**/advancements/EnterMystDimensionSafeTrigger.java'
        exclude '**/advancements/WritingDeskWriteTrigger.java'
        // JigsawPlacement.addPieces signature changed in 1.20.4+ (requires PoolAliasLookup)
        exclude '**/world/structure/AbandonedLibraryStructure.java'
        exclude '**/world/structure/UndergroundArchiveStructure.java'
        exclude '**/world/structure/ScatteredLibraryStructure.java'
        // MinecraftSessionService.getTextures signature changed in 1.20.4+
        exclude '**/util/PocketHeadUtils.java'
    })
    source(project.fileTree("${rootDir}/neoforge/shared/src/main/java") {
        exclude '**/client/NeoForgeClientNetworkEvents.java'
        exclude '**/client/renderer/RainbowRenderer.java'
        exclude '**/gametest/MystcraftNeoForgeGameTests.java'
        exclude '**/neoforge/BoosterPackLootModifier.java'
        exclude '**/neoforge/GuidebookLootModifier.java'
        exclude '**/neoforge/MystcraftNeoForge.java'
        exclude '**/neoforge/NeoForgeRegistries.java'
        exclude '**/neoforge/SymbolPageLootModifier.java'
        exclude '**/network/LecternBookSyncPacket.java'
        exclude '**/network/NeoForgeMystcraftNetwork.java'
        exclude '**/platform/NeoForgeAdvancementTriggerFactory.java'
        exclude '**/platform/NeoForgeEventHelper.java'
        exclude '**/platform/NeoForgeVersionHelper.java'
        exclude '**/world/structure/AbandonedLibraryStructure.java'
        exclude '**/world/structure/ScatteredLibraryStructure.java'
        exclude '**/world/structure/UndergroundArchiveStructure.java'
    })
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from project(':common').sourceSets.main.resources
    from sourceSets.main.resources

    def expandProps = [
            'version'                      : project.version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version_1_20_4,
            'minecraft_version_range'      : minecraft_version_range_1_20_4,
            'neoforge_version'             : neoforge_version_1_20_4,
            'neoforge_loader_version_range': neoforge_loader_version_range_1_20_4,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.findProperty('description') ?: project.description,
            'mod_description'              : project.findProperty('description') ?: project.description,
            'minecraft_version_range_1_20_4': minecraft_version_range_1_20_4,
            'neoforge_version_1_20_4'       : neoforge_version_1_20_4,
            'neoforge_loader_version_range_1_20_4': neoforge_loader_version_range_1_20_4,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    filesMatching(['pack.mcmeta', 'META-INF/mods.toml']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':common').sourceSets.main.allSource
    from project(':common').sourceSets.main.resources
    from file("${rootDir}/neoforge/shared/src/main/java")
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "MystcraftLegacy_NeoForge-${minecraft_version_1_20_4}.jar"

    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version_1_20_4
        ])
    }
}

sourcesJar {
    archiveFileName = "MystcraftLegacy_NeoForge-${minecraft_version_1_20_4}-sources.jar"
}
