// Base NeoForge adapter module - contains shared code compiled by version subprojects
// No JAR is produced from this module directly

plugins {
    id 'java'
}

// Minimal setup so version subprojects can reference this module's source
java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

// Skip compilation - source is compiled by version subprojects
tasks.named('compileJava') { enabled = false }
tasks.named('processResources') { enabled = false }
tasks.named('classes') { enabled = false }
tasks.named('jar') { enabled = false }
tasks.named('sourcesJar') { enabled = false }
