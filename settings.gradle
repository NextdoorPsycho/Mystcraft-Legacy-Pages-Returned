pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net')
        }
        maven {
            name = 'Sponge'
            url = uri('https://repo.spongepowered.org/repository/maven-public')
        }
        maven {
            name = 'Forge'
            url = uri('https://maven.minecraftforge.net')
        }
        maven {
            name = 'NeoForge'
            url = uri('https://maven.neoforged.net/releases')
        }
    }
}

plugins {
    // Foojay Toolchains Plugin - automatically downloads/provisions correct JDK versions
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'Mystcraft'
include('common')
include('fabric:1.18.2')
include('fabric:1.19.2')
include('fabric:1.20.1')
include('fabric:1.20.2')
include('forge:1.18.2')
include('forge:1.19.2')
include('forge:1.20.1')
include('forge:1.20.2')
include('neoforge:1.20.2')

// Floo_Powder sources are compiled directly as part of each platform module
// to avoid circular dependencies with VanillaGradle plugins
